server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: native # for testing
  cloud:
    config:
      server:
        native:
          search-locations: file://${user.home}/IdeaProjects/2026/appointment-config-repo/


management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
